# Comprueba que la implementación de referencia siga cumpliendo sus vectores.
#
# ── Por qué esto importa más acá que en un repo normal ──────────────────────
#
# El valor entero del sobre es que dos implementaciones independientes produzcan
# los MISMOS bytes. Si la canonicalización cambia sin querer, no se rompe una
# prueba: se invalidan todas las firmas ya emitidas, y nadie se entera hasta que
# alguien intenta verificar un documento viejo. Eso no se descubre a tiempo
# revisando el diff — se descubre corriendo los vectores en cada push.
#
# Hasta el 2026-08-09 nada corría esta suite automáticamente. La spec afirmaba
# vectores que solo se comprobaban cuando alguien se acordaba.
#
# Sin dependencias a propósito: `sobre.rb` es stdlib pura y la suite también. Un
# estándar que necesita un gestor de paquetes para comprobarse a sí mismo pone
# una barrera justo donde no debe.

name: ci

on:
  push:
  pull_request:
  # Los vectores incluyen una fecha (`reglasVerificadasAl`) y el verificador
  # calcula su antigüedad. Correr sin cambios, de vez en cuando, atrapa lo que
  # se pudre por el paso del tiempo y no por un commit.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  vectores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: la suite pasa
        run: ruby sobre_test.rb

      # La herramienta que certifica a otros, certificada. Su modo de falla no
      # es caerse: es APROBAR a quien no debe — y ya pasó una vez, aprobando
      # los cuatro casos de rechazo de un verificador que ni existía.
      - name: la conformidad no aprueba a quien no debe
        run: ruby conformidad_test.rb

      # Además de la suite, se corre el comando TAL COMO lo documenta el §7 y
      # el README. Si la documentación y el CLI se separan, esto se pone rojo —
      # que es distinto de que la librería siga bien por dentro.
      - name: el vector ASCII verifica con el comando documentado
        run: ruby sobre.rb verificar vectores/sobre.json --llave vectores/llave-publica.pem

      - name: el vector unicode verifica con el comando documentado
        run: ruby sobre.rb verificar vectores/sobre-unicode.json --llave vectores/llave-publica.pem

      # Un verificador que dice OK a todo se ve idéntico a uno que funciona.
      # Esto lo ataca: se altera un byte y se EXIGE que falle.
      - name: un sobre alterado NO verifica
        run: |
          sed 's/1234567/1234568/' vectores/sobre-unicode.json > /tmp/alterado.json
          if ruby sobre.rb verificar /tmp/alterado.json --llave vectores/llave-publica.pem; then
            echo "FALLA: el verificador aceptó un documento alterado" >&2
            exit 1
          fi
          echo "correcto: lo rechazó"

      # La referencia se somete al MISMO contrato que le pedimos a un tercero.
      # Si `conformidad.rb` se rompiera, esto lo dice acá y no en la máquina de
      # alguien que está intentando adoptar el formato — que es el peor lugar
      # posible para descubrir que la herramienta de conformidad no sirve.
      - name: la referencia pasa su propia suite de conformidad
        run: |
          ruby conformidad.rb \
            --canonicalizador "ruby -r./sobre -rjson -e 'puts Sobre.bytes_canonicos(JSON.parse(\$stdin.read.force_encoding(%q{UTF-8})))'" \
            --verificador "ruby sobre.rb verificar - --llave vectores/llave-publica.pem" \
            --firmador "ruby sobre.rb firmar - --llave-privada vectores/llave-privada-SOLO-PRUEBAS.pem"

      # El verificador web es la SEGUNDA implementación, y es la que abre un
      # tercero desde el navegador. Que coincida con la de referencia es la
      # evidencia de que el formato es implementable — o sea, lo único que
      # separa a esto de "un JSON que le gusta a un repo".
      #
      # Se extraen sus funciones tal como se sirven, sin reescribirlas: si se
      # adaptaran para la prueba, se estaría probando la adaptación.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # La implementación de Node, sometida al MISMO contrato que un tercero.
      # Que dos programas independientes produzcan bytes idénticos es la única
      # evidencia de que la spec se puede implementar leyéndola.
      - name: la implementación JavaScript pasa la conformidad
        run: |
          ruby conformidad.rb \
            --canonicalizador "node sobre.mjs canonicalizar -" \
            --verificador "node sobre.mjs verificar - --llave vectores/llave-publica.pem" \
            --firmador "node sobre.mjs firmar - --llave-privada vectores/llave-privada-SOLO-PRUEBAS.pem"

      # Cruzada en las dos direcciones. La conformidad prueba cada una contra
      # los vectores; esto prueba que se entienden ENTRE SÍ, que es lo que le
      # va a pasar a un comprador real: firma un agente, verifica otro.
      - name: Ruby y JavaScript se verifican mutuamente
        run: |
          ruby -rjson -e 'd=JSON.parse(File.read("vectores/sobre-unicode.json",encoding:"UTF-8")); d.delete("signature"); File.write("doc.json", JSON.generate(d))'
          node sobre.mjs firmar doc.json --llave-privada vectores/llave-privada-SOLO-PRUEBAS.pem \
            | ruby sobre.rb verificar - --llave vectores/llave-publica.pem
          ruby sobre.rb firmar doc.json --llave-privada vectores/llave-privada-SOLO-PRUEBAS.pem \
            | node sobre.mjs verificar - --llave vectores/llave-publica.pem

      - name: el verificador web canonicaliza igual que la referencia
        run: |
          python3 - <<'PY'
          import pathlib
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          codigo = html[html.index("function compararUtf8"):html.index("/* ── Llave ")]
          pathlib.Path("/tmp/canon-web.js").write_text(
            "const enc = new TextEncoder();\n" + codigo +
            "\nlet s='';process.stdin.on('data',d=>s+=d)"
            ".on('end',()=>{process.stdout.write(serializar(JSON.parse(s)))});\n",
            encoding="utf-8")
          PY
          ruby conformidad.rb --canonicalizador "node /tmp/canon-web.js"

      # Y la parte que de verdad prueba que la conformidad SIRVE: una
      # implementación rota a propósito tiene que ser RECHAZADA. Un runner que
      # solo sabe decir OK es exactamente el problema que vino a resolver.
      - name: la conformidad RECHAZA un canonicalizador roto
        run: |
          cat > /tmp/roto.rb <<'RB'
          require "json"
          # Ordena por longitud en vez de por bytes: plausible y equivocado.
          def c(v)
            case v
            when Hash then v.reject { |k, x| k == "signature" || x.nil? }
                           .sort_by { |k, _| [k.length, k] }.to_h { |k, x| [k, c(x)] }
            when Array then v.map { |x| c(x) }
            else v
            end
          end
          puts JSON.generate(c(JSON.parse($stdin.read.force_encoding("UTF-8"))))
          RB
          if ruby conformidad.rb --canonicalizador "ruby /tmp/roto.rb"; then
            echo "FALLA: la conformidad aprobó una implementación rota" >&2
            exit 1
          fi
          echo "correcto: la rechazó"
