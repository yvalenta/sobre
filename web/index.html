// llamar al servidor de quien firmo no es un verificador offline: si ese

const PEM_EMBEBIDO = `-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAaB5DJXNAqRHkZavTQ5EMe2Ng55GOgCJ7fIgBjKiWv2E=
-----END PUBLIC KEY-----
`;

const enc = new TextEncoder();

/* ── Idiomas ───────────────────────────────────────────────────────────────

   archivo aparte — separarlos permitiria que uno derive del otro sin que se
   note, que es exactamente lo que este proyecto no quiere.

   Los `id` de los checks (firma_verifica, reglas_hash...) NO se traducen: son

const IDIOMAS = Object.keys(I18N);
const CLAVE_GUARDADA = "sobre.idioma";

/** Ingles por defecto. Solo lo cambia una eleccion EXPLICITA: `?lang=` o lo que
    el usuario haya elegido antes. No se mira `navigator.language` a proposito —
    el idioma de vitrina es una decision de producto, no del navegador. */
function idiomaInicial() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && IDIOMAS.includes(q.toLowerCase())) return q.toLowerCase();
  try {
    const g = localStorage.getItem(CLAVE_GUARDADA);
    if (g && IDIOMAS.includes(g)) return g;
  } catch { /* localStorage puede estar bloqueado; el default alcanza */ }
  return "en";
}

let idioma = idiomaInicial();

/** Busca la clave y sustituye {marcadores}. Si falta, cae al ingles y despues
    a la clave cruda: una pagina con una etiqueta sin traducir es incomoda, una
    con `undefined` parece rota. */
function t(clave, params) {
  let s = I18N[idioma][clave];
  if (s === undefined) s = I18N.en[clave];
  if (s === undefined) return clave;
  if (!params) return s;
  return s.replace(/\{(\w+)\}/g, (_, k) => (params[k] === undefined ? "" : String(params[k])));
}

function aplicarIdioma() {
  document.documentElement.lang = t("html_lang");
  document.title = t("doc_titulo");
  const md = document.getElementById("meta-desc");
  if (md) md.setAttribute("content", t("meta"));

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria));
  });

  document.querySelectorAll(".idiomas button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === idioma));
  });

  // `llave_texto` se re-inyecta con innerHTML, asi que el <code id="idllave">
  // que estaba adentro se pierde en cada cambio de idioma. Se vuelve a llenar.
  pintarIdLlave();
  // Y si ya habia un veredicto en pantalla, se vuelve a dibujar traducido: un
  // resultado que se queda en el idioma anterior es peor que no traducir nada,
  // porque parece que la pagina se rompio a la mitad.
  repintarSalida();
}

function cambiarIdioma(nuevo) {
  if (!IDIOMAS.includes(nuevo) || nuevo === idioma) return;
  idioma = nuevo;
  try { localStorage.setItem(CLAVE_GUARDADA, nuevo); } catch { /* modo privado */ }
  aplicarIdioma();
}

/* ── Forma canonica (spec §3) ──────────────────────────────────────────────
   Se serializa a mano en vez de usar JSON.stringify sobre un objeto
   reconstruido. Motivo: en JS las claves que parecen enteros ("0", "1") se
   reordenan solas al frente sin importar en que orden las insertaste, asi que
   un objeto con esas claves produciria bytes distintos a los de Ruby. */
function compararUtf8(a, b) {
  const A = enc.encode(a), B = enc.encode(b);
  const n = Math.min(A.length, B.length);
  for (let i = 0; i < n; i++) if (A[i] !== B[i]) return A[i] - B[i];
  return A.length - B.length;
}

function serializar(v) {
  if (v === null || v === undefined) return "null";
  if (Array.isArray(v)) return "[" + v.map(serializar).join(",") + "]";
  if (typeof v === "object") {
    const claves = Object.keys(v)
      .filter((k) => k !== "signature" && v[k] !== null && v[k] !== undefined)
      .sort(compararUtf8);
    return "{" + claves.map((k) => JSON.stringify(k) + ":" + serializar(v[k])).join(",") + "}";
  }
  return JSON.stringify(v);
}

/* ── Llave ─────────────────────────────────────────────────────────────── */
function normalizarPem(pem) {
  const cuerpo = pem.replace(/-----[A-Z ]+-----/g, "").replace(/\s+/g, "");
  return "-----BEGIN PUBLIC KEY-----\n" +
         (cuerpo.match(/.{1,64}/g) || []).join("\n") +
         "\n-----END PUBLIC KEY-----\n";
}

async function idDeLlave(pem) {
  const h = await crypto.subtle.digest("SHA-256", enc.encode(normalizarPem(pem)));
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
}

function pemADer(pem) {
  const b64 = pem.replace(/-----[A-Z ]+-----/g, "").replace(/\s+/g, "");
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}

function b64ABytes(b64) {
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}

async function importar(pem) {
  return crypto.subtle.importKey("spki", pemADer(pem), { name: "Ed25519" }, false, ["verify"]);
}

async function verificaFirma(doc, llave) {
  const valor = doc?.signature?.valor;
  if (!valor) return false;
  try {
    return await crypto.subtle.verify("Ed25519", llave, b64ABytes(valor), enc.encode(serializar(doc)));
  } catch { return false; }
}

// Muta el primer valor util. Sirve para probar que el verificador de verdad
// esta comprobando: uno que acepta cualquier cosa se ve igual que uno bueno.
function mutar(v) {
  if (Array.isArray(v)) {
    for (let i = 0; i < v.length; i++) {
      const m = mutar(v[i]);
      if (m !== undefined) { const c = v.slice(); c[i] = m; return c; }
    }
    return undefined;
  }
  if (v && typeof v === "object") {
    for (const k of Object.keys(v)) {
      if (k === "signature") continue;
      const val = v[k];
      if (typeof val === "number") return { ...v, [k]: val + 1 };
      if (typeof val === "string" && val) return { ...v, [k]: val + "~" };
      if (val && typeof val === "object") {
        const m = mutar(val);
        if (m !== undefined) return { ...v, [k]: m };
      }
    }
  }
  return undefined;
}

/* ── Analisis (spec §6) ──────────────────────────────────────────────────
   Cada check guarda una CLAVE y sus parametros, no un texto ya armado. Es lo
   que permite cambiar de idioma con un veredicto en pantalla sin re-verificar
   nada: la criptografia se corre una vez y el texto se pinta cuantas veces
   haga falta. Tambien evita el error tipico de i18n a medias, que es traducir
   la interfaz y dejar el resultado —lo unico que la gente lee— en el idioma
   del que lo programo. */
async function analizar(doc, pem) {
  const checks = [];
  const add = (id, critico, ok, clave, params) => checks.push({ id, critico, ok, clave, params });
  const sig = doc.signature || {};

  add("firma_presente", true, !!sig.valor,
      sig.valor ? "c_firma_presente_ok" : "c_firma_presente_no",
      { algo: sig.algo || "?" });

  let llave = null;
  try { llave = await importar(pem); }
  catch { add("llave_legible", true, false, "c_llave_legible_no"); }

  if (llave) {
    const valida = await verificaFirma(doc, llave);
    add("firma_verifica", true, valida,
        valida ? "c_firma_verifica_ok" : "c_firma_verifica_no");

    const idReal = await idDeLlave(pem);
    const coincide = !sig.publicKeyId || sig.publicKeyId === idReal;
    add("llave_declarada", true, coincide,
        coincide ? "c_llave_declarada_ok" : "c_llave_declarada_no",
        { id: idReal, real: idReal, declarado: sig.publicKeyId });

    if (valida) {
      const alterado = mutar(doc);
      const detecta = alterado ? !(await verificaFirma(alterado, llave)) : false;
      add("detecta_manipulacion", true, detecta,
          detecta ? "c_detecta_ok" : "c_detecta_no");
    }
  }

  const hash = doc.reglasHash || doc.reglas?.hash;
  add("reglas_hash", false, !!hash,
      hash ? "c_reglas_ok" : "c_reglas_no",
      { hash: String(hash || "").slice(0, 16) });

  const fecha = doc.reglasVerificadasAl || doc.verificadoAl;
  let dias = null;
  if (fecha) {
    const d = Math.floor((Date.now() - Date.parse(fecha)) / 86400000);
    if (Number.isFinite(d)) dias = d;
  }
  add("fecha_verificacion", false, !!fecha,
      fecha ? "c_fecha_ok" : "c_fecha_no",
      { fecha, dias });

  const hd = doc.habeasData || {};
  const completo = "persistidoEnBd" in hd && "procesadoPorLlmExterno" in hd;
  add("habeas_data", false, completo,
      completo ? "c_habeas_ok" : "c_habeas_no",
      { bd: hd.persistidoEnBd, llm: hd.procesadoPorLlmExterno });

  const veredicto = checks.some((c) => c.critico && !c.ok) ? "invalido"
                  : checks.every((c) => c.ok) ? "verificable" : "firmado_sin_procedencia";
  return { checks, veredicto };
}

/* ── Interfaz ──────────────────────────────────────────────────────────── */
const VEREDICTOS = {
  verificable: ["v-ok", "v_verificable_t", "v_verificable_d"],
  firmado_sin_procedencia: ["v-tibio", "v_firmado_t", "v_firmado_d"],
  invalido: ["v-mal", "v_invalido_t", "v_invalido_d"]
};

const $salida = document.getElementById("salida");
const $zona = document.getElementById("zona");
const $archivo = document.getElementById("archivo");
const $pem = document.getElementById("pem");

// Lo ultimo que se mostro, para poder repintarlo en el otro idioma.
let ultimo = null;

function pemActivo() {
  const v = $pem.value.trim();
  return v.includes("BEGIN") ? v + "\n" : PEM_EMBEBIDO;
}

function escapar(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function pintarIdLlave() {
  const el = document.getElementById("idllave");
  if (!el) return;
  idDeLlave(PEM_EMBEBIDO).then((id) => {
    const ahora = document.getElementById("idllave");
    if (ahora) ahora.textContent = id;
  });
}

function detalleDe(c) {
  const p = { ...(c.params || {}) };
  if (c.clave === "c_fecha_ok") {
    p.extra = p.dias === null || p.dias === undefined ? "" : t("c_dias", { n: p.dias });
  }
  return t(c.clave, p);
}

function repintarSalida() {
  if (!ultimo) return;
  if (ultimo.tipo === "error") return pintarError(ultimo.clave, ultimo.params);
  pintarResultado(ultimo.res, ultimo.nombre);
}

function pintarError(clave, params) {
  ultimo = { tipo: "error", clave, params };
  $salida.innerHTML =
    `<div class="veredicto v-mal"><h2>${escapar(t("err_titulo"))}</h2>` +
    `<p>${escapar(t(clave, params))}</p></div>`;
}

function pintarResultado(res, nombre) {
  ultimo = { tipo: "resultado", res, nombre };
  const [clase, claveTitulo, claveDesc] = VEREDICTOS[res.veredicto];
  const filas = res.checks.map((c) => {
    const marca = c.ok ? ["m-ok", "✓"] : c.critico ? ["m-mal", "✕"] : ["m-falta", "!"];
    return `<li><div class="marca ${marca[0]}">${marca[1]}</div>
      <div class="cuerpo"><code>${escapar(c.id)}</code><span>${escapar(detalleDe(c))}</span></div></li>`;
  }).join("");

  $salida.innerHTML =
    `<div class="veredicto ${clase}"><h2>${escapar(t(claveTitulo))}</h2><p>${escapar(t(claveDesc))}</p></div>
     <ul class="checks">${filas}</ul>
     <p class="pie">${escapar(t("archivo"))}: <code>${escapar(nombre || t("pegado"))}</code></p>`;
}

async function procesar(texto, nombre) {
  let doc;
  try { doc = JSON.parse(texto); }
  catch (e) { return pintarError("err_json", { msg: e.message }); }
  if (!doc || typeof doc !== "object") return pintarError("err_no_objeto");

  let res;
  try { res = await analizar(doc, pemActivo()); }
  catch (e) { return pintarError("err_verificando", { msg: e.message }); }

  pintarResultado(res, nombre);
}

function leer(file) {
  const r = new FileReader();
  r.onload = () => procesar(r.result, file.name);
  r.onerror = () => pintarError("err_archivo");
  r.readAsText(file, "UTF-8");
}

// ── Verificar desde una URL: ?url=https://host/algo.json ────────────────────
//
// Existe para que comprobar sea UN CLIC. Sin esto, quien quiera verificar un
// sobre antes de confiar en el emisor tiene que bajar el JSON y arrastrarlo,
// y ese paso de más es donde se pierde a la gente.
//
// La verificación sigue ocurriendo entera en este navegador: se descarga el
// documento y se comprueba su firma acá. La URL no se manda a ningún lado.

/** Solo http(s). Corta `javascript:`, `data:` y `file:` de raíz. */
function urlSegura(crudo) {
  let u;
  try { u = new URL(crudo, location.href); } catch { return null; }
  return (u.protocol === "https:" || u.protocol === "http:") ? u : null;
}

/**
 * Saca el sobre de lo que haya devuelto el servidor.
 *
 * Un endpoint de ejemplo suele responder un envoltorio didáctico
 * (`{instrucciones, input, output}`) y el sobre real está en `output`. Sin
 * esto, el caso de uso más obvio —pegar la URL del ejemplo público— daría
 * "no tiene firma" sobre un documento que sí la tiene.
 */
function extraerSobre(doc) {
  if (doc && typeof doc === "object" && !doc.signature) {
    for (const campo of ["output", "sobre", "resultado"]) {
      const dentro = doc[campo];
      if (dentro && typeof dentro === "object" && dentro.signature) {
        return { doc: dentro, campo };
      }
    }
  }
  return { doc, campo: null };
}

async function desdeUrl(crudo) {
  const u = urlSegura(crudo);
  if (!u) return pintarError("err_url");

  ultimo = null;
  $salida.innerHTML =
    `<div class="veredicto"><h2>${escapar(t("descargando"))}</h2><p><code>${escapar(u.href)}</code></p></div>`;

  let texto;
  try {
    const r = await fetch(u.href, { headers: { accept: "application/json" } });
    if (!r.ok) return pintarError("err_http", { code: r.status, texto: r.statusText });
    texto = await r.text();
  } catch (e) {
    // Casi siempre es CORS: el emisor tiene que servir la llave y el documento
    // con Access-Control-Allow-Origin para que un verificador ajeno los lea.
    return pintarError("err_descarga", { msg: e.message });
  }

  let doc;
  try { doc = JSON.parse(texto); }
  catch (e) { return pintarError("err_json_url", { msg: e.message }); }

  const { doc: sobre, campo } = extraerSobre(doc);
  await procesar(JSON.stringify(sobre), u.href + (campo ? ` → .${campo}` : ""));
}

document.querySelectorAll(".idiomas button").forEach((b) => {
  b.addEventListener("click", () => cambiarIdioma(b.dataset.lang));
});

$zona.addEventListener("click", () => $archivo.click());
$zona.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $archivo.click(); }
});
$archivo.addEventListener("change", () => { if ($archivo.files[0]) leer($archivo.files[0]); });

["dragenter", "dragover"].forEach((ev) =>
  $zona.addEventListener(ev, (e) => { e.preventDefault(); $zona.classList.add("encima"); }));
["dragleave", "drop"].forEach((ev) =>
  $zona.addEventListener(ev, (e) => { e.preventDefault(); $zona.classList.remove("encima"); }));
$zona.addEventListener("drop", (e) => { if (e.dataTransfer.files[0]) leer(e.dataTransfer.files[0]); });

document.addEventListener("paste", (e) => {
  const t2 = e.clipboardData.getData("text");
  if (t2 && t2.trim().startsWith("{")) procesar(t2, null);
});

aplicarIdioma();

// Arranque: `?url=` verifica solo, sin que nadie toque nada.
//
//   /verificar?url=https://host/api/batch/verificar/ejemplo
//
// `?llave-url=` permite además traer la llave pública del emisor, para
// comprobar sobres que no son nuestros — que es el caso que hace del sobre un
// formato y no una marca.
(async function arranque() {
  const q = new URLSearchParams(location.search);
  const url = q.get("url");
  if (!url) return;

  const llaveUrl = q.get("llave-url");
  if (llaveUrl) {
    const u = urlSegura(llaveUrl);
    if (u) {
      try {
        const r = await fetch(u.href);
        if (r.ok) document.getElementById("pem").value = (await r.text()).trim();
      } catch { /* si falla se sigue con la llave embebida; el veredicto lo dirá */ }
    }
  }
  desdeUrl(url);
})();
</script>
</body>
</html>
